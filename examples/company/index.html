<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>site-world — company example</title>
    <style>
      html, body, #root { margin: 0; height: 100%; background: #0a0d13; color: #ece7da; font-family: ui-monospace, monospace; }
      .bar { position: fixed; top: 0; left: 0; z-index: 10; display: flex; gap: 8px; padding: 8px; }
      .bar button { font: inherit; background: none; color: inherit; border: 1px solid #5b5a52; padding: 2px 10px; cursor: pointer; }
      .bar button[aria-pressed="true"] { background: #ece7da; color: #0a0d13; }
      .stage { position: absolute; inset: 0; }
      .stage .sw-canvas-wrap { height: 100%; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
